# docker compose up --build   →   http://localhost:8080   (tài khoản demo: xem README)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: stockflow
      MYSQL_ROOT_PASSWORD: root
    command: ["--log-bin-trust-function-creators=1"]   # cho phép tạo trigger bất biến (migration 002)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 3s
      retries: 30
    volumes: [dbdata:/var/lib/mysql]
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: stockflow
      DB_USER: stockflow
      DB_PASS: stockflow
    ports: ["8080:8080"]
volumes:
  dbdata:
