<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="Điều chuyển: thành công thì trừ kho đi và cộng kho đến cùng lúc; lỗi giữa chừng thì rollback">
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-anchor:middle} .m{font-family:ui-monospace,Menlo,Consolas,monospace}</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#ee4d2d"/></linearGradient></defs>
<rect width="1000" height="330" rx="16" fill="#fff7f4"/>
<!-- kho A / B -->
<g><rect x="40" y="40" width="240" height="150" rx="14" fill="#fff" stroke="#ee4d2d" stroke-width="2"/>
<rect x="40" y="40" width="240" height="38" rx="14" fill="url(#g)"/><rect x="40" y="64" width="240" height="14" fill="#ee4d2d"/>
<text x="160" y="66" font-size="16" font-weight="700" fill="#fff">KHO A · HN01</text>
<text x="160" y="150" font-size="56" font-weight="800" fill="#1f2933">50<animate attributeName="opacity" values="1;0;1;0;1" keyTimes="0.000;0.220;0.500;0.620;0.780" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="160" y="150" font-size="56" font-weight="800" fill="#16a34a" opacity="0">30<animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0.000;0.220;0.500;0.620;0.780" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="160" y="150" font-size="56" font-weight="800" fill="#dc2626" opacity="0">30<animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0.000;0.220;0.500;0.620;0.780" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="160" y="176" font-size="13" fill="#7b8794">tồn hiện có</text></g>
<g><rect x="720" y="40" width="240" height="150" rx="14" fill="#fff" stroke="#ee4d2d" stroke-width="2"/>
<rect x="720" y="40" width="240" height="38" rx="14" fill="url(#g)"/><rect x="720" y="64" width="240" height="14" fill="#ee4d2d"/>
<text x="840" y="66" font-size="16" font-weight="700" fill="#fff">KHO B · HCM01</text>
<text x="840" y="150" font-size="56" font-weight="800" fill="#1f2933">10<animate attributeName="opacity" values="1;0;1" keyTimes="0.000;0.250;0.500" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="840" y="150" font-size="56" font-weight="800" fill="#16a34a" opacity="0">30<animate attributeName="opacity" values="0;1;0" keyTimes="0.000;0.250;0.500" calcMode="discrete" dur="14s" repeatCount="indefinite"/></text>
<text x="840" y="176" font-size="13" fill="#7b8794">tồn hiện có</text></g>
<!-- đường đi + thùng hàng -->
<path id="p" d="M280 115 C 420 60, 580 60, 720 115" fill="none" stroke="#ee4d2d" stroke-width="3" stroke-dasharray="8 9" stroke-opacity=".55"><animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.1s" repeatCount="indefinite"/></path>
<g><rect x="-14" y="-14" width="28" height="28" rx="5" fill="#ffd166"/><path d="M-14 -3H14M0 -14V-3" stroke="#b45309" stroke-width="3"/>
<animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1;0;0;0.5;0;0" keyTimes="0.000;0.030;0.220;0.500;0.500;0.550;0.650;0.780;1.000"><mpath href="#p"/></animateMotion>
<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0.000;0.220;0.240;0.500;0.520;1.000" calcMode="discrete" dur="14s" repeatCount="indefinite"/></g>
<!-- sổ phát sinh -->
<g class="m" font-size="14">
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.000;0.270;0.500" calcMode="discrete" dur="14s" repeatCount="indefinite"/><rect x="250" y="215" width="500" height="26" rx="6" fill="#fff" stroke="#fbd5c9"/><text x="500" y="233" fill="#dc2626" font-weight="700" style="text-anchor:middle">DCX  A  −20   (50 → 30)   ✔ ghi sổ</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.000;0.310;0.500" calcMode="discrete" dur="14s" repeatCount="indefinite"/><rect x="250" y="247" width="500" height="26" rx="6" fill="#fff" stroke="#bbf7d0"/><text x="500" y="265" fill="#16a34a" font-weight="700" style="text-anchor:middle">DCN  B  +20   (10 → 30)   ✔ ghi sổ</text></g></g>
<!-- nhãn trạng thái -->
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.000;0.270;0.500" calcMode="discrete" dur="14s" repeatCount="indefinite"/><rect x="330" y="288" width="340" height="30" rx="15" fill="#16a34a"/><text x="500" y="309" font-size="15" font-weight="700" fill="#fff">COMMIT — một giao dịch, hai kho</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.000;0.640;0.800" calcMode="discrete" dur="14s" repeatCount="indefinite"/><rect x="300" y="215" width="400" height="26" rx="6" fill="#fff" stroke="#fecaca"/><text x="500" y="233" class="m" font-size="14" fill="#dc2626" font-weight="700" style="text-anchor:middle">💥 lỗi giữa chừng — A đã trừ, B chưa cộng</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.000;0.800;0.990" calcMode="discrete" dur="14s" repeatCount="indefinite"/><rect x="310" y="288" width="380" height="30" rx="15" fill="#dc2626"/><text x="500" y="309" font-size="15" font-weight="700" fill="#fff">ROLLBACK — không mất hàng, không nhân đôi</text></g>
<text x="500" y="20" font-size="13" fill="#7b8794" opacity=".0"> </text>
</svg>