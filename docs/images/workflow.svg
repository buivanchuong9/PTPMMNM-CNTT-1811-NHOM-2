<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img" aria-label="Vòng đời chứng từ: Lập phiếu, Kiểm tra, Xác nhận và ghi sổ; sửa bằng chứng từ điều chỉnh">
  <style>
    text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-anchor:middle}
    .n{fill:#fff;stroke:#ee4d2d;stroke-width:3}.t{font-size:16px;font-weight:700;fill:#1f2933}.s{font-size:13px;fill:#7b8794}
    .a{stroke:#ee4d2d;stroke-width:3;stroke-dasharray:8 8;fill:none;animation:d 1s linear infinite}@keyframes d{to{stroke-dashoffset:-16}}
    .adj{fill:#fff4f0;stroke:#ee4d2d;stroke-width:2;stroke-dasharray:6 5}
  </style>
  <path class="a" d="M200 70H300"/><path class="a" d="M500 70H600"/><path d="M300 70l-12-7v14zM600 70l-12-7v14z" fill="#ee4d2d"/>
  <rect class="n" x="30" y="30" width="170" height="80" rx="14"/><rect class="n" x="300" y="30" width="200" height="80" rx="14"/><rect class="n" x="600" y="30" width="220" height="80" rx="14"/>
  <rect class="adj" x="850" y="30" width="125" height="80" rx="14"/>
  <text class="t" x="115" y="66">Lập phiếu</text><text class="s" x="115" y="88">nháp · chưa đổi tồn</text>
  <text class="t" x="400" y="66">Kiểm tra</text><text class="s" x="400" y="88">đủ hàng? đúng lô?</text>
  <text class="t" x="710" y="66">Xác nhận &amp; ghi sổ</text><text class="s" x="710" y="88">khoá tồn · cập nhật · sổ cái</text>
  <text class="t" x="912" y="66">Sai?</text><text class="s" x="912" y="88">chứng từ đảo</text>
  <path d="M820 70H850" stroke="#ee4d2d" stroke-width="2" stroke-dasharray="4 4"/>
  <text class="s" x="500" y="150">Bấm lại “Xác nhận” = không ghi thêm (idempotent) · lỗi giữa chừng = rollback toàn bộ</text>
  <text class="s" x="500" y="174">Lịch sử không bao giờ bị xoá hay sửa — chỉ thêm dòng mới</text>
  <g><rect x="-12" y="-12" width="24" height="24" rx="5" fill="#ffd166"/><path d="M-12 -2H12M0 -12V-2" stroke="#b45309" stroke-width="3"/>
    <animateMotion dur="5s" repeatCount="indefinite" path="M115 14 L400 14 L710 14 L912 14"/></g>
</svg>
