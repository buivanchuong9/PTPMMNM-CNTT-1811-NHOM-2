<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="StockFlow: quản lý kho đa điểm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172d4b"/><stop offset=".55" stop-color="#254c88"/><stop offset="1" stop-color="#3d73c4"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#78a3e6" stop-opacity=".45"/><stop offset="1" stop-color="#78a3e6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".07"/></pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#78a3e6"/><stop offset="1" stop-color="#3d73c4"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1626" flood-opacity=".45"/></filter>
    <g id="wh"><path d="M-13 9V-3L0 -12L13 -3V9Z" fill="#3d73c4"/><rect x="-6" y="1" width="12" height="8" rx="1" fill="#fff"/></g>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <circle cx="870" cy="200" r="300" fill="url(#glow)"/>

  <!-- Chữ bên trái -->
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" fill="#fff">
    <rect x="70" y="92" width="222" height="30" rx="15" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".25"/>
    <circle cx="90" cy="107" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="102" y="112" font-size="13" font-weight="700" letter-spacing="1.6">QUẢN LÝ KHO ĐA ĐIỂM</text>
    <text x="66" y="196" font-size="78" font-weight="800" letter-spacing="-2.5">Stock<tspan fill="#a3c1ef">Flow</tspan></text>
    <text x="70" y="238" font-size="20" fill-opacity=".88">Nhập, xuất, điều chuyển và kiểm kê</text>
    <text x="70" y="266" font-size="20" fill-opacity=".88">cho nhiều kho trên một hệ thống.</text>
    <g font-size="13" font-weight="600">
      <rect x="70" y="296" width="92" height="28" rx="8" fill="#fff" fill-opacity=".1"/><text x="116" y="315" text-anchor="middle">PHP 8.1+</text>
      <rect x="170" y="296" width="80" height="28" rx="8" fill="#fff" fill-opacity=".1"/><text x="210" y="315" text-anchor="middle">MySQL</text>
      <rect x="258" y="296" width="128" height="28" rx="8" fill="#fff" fill-opacity=".1"/><text x="322" y="315" text-anchor="middle">Không framework</text>
    </g>
  </g>

  <!-- Khung bảng điều khiển bên phải -->
  <g transform="translate(620 58)" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <g filter="url(#sh)">
      <rect width="520" height="298" rx="14" fill="#fff"/>
      <path d="M0 14a14 14 0 0 1 14-14h492a14 14 0 0 1 14 14v22H0Z" fill="#3d73c4"/>
    </g>
    <circle cx="20" cy="18" r="5" fill="#fff" fill-opacity=".55"/><circle cx="36" cy="18" r="5" fill="#fff" fill-opacity=".55"/><circle cx="52" cy="18" r="5" fill="#fff" fill-opacity=".55"/>
    <text x="260" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" letter-spacing="1">TỔNG QUAN KHO</text>

    <!-- 3 ô số liệu -->
    <g font-size="11" fill="#697586">
      <rect x="20" y="52" width="150" height="58" rx="8" fill="#eaf2fd"/><text x="32" y="72">Giá trị tồn</text>
      <text x="32" y="98" font-size="20" font-weight="800" fill="#172d4b">1,59 tỷ</text>
      <rect x="185" y="52" width="150" height="58" rx="8" fill="#e8f8ee"/><text x="197" y="72">Hàng nhập</text>
      <text x="197" y="98" font-size="20" font-weight="800" fill="#15803d">12.800</text>
      <rect x="350" y="52" width="150" height="58" rx="8" fill="#fef1dc"/><text x="362" y="72">Hàng xuất</text>
      <text x="362" y="98" font-size="20" font-weight="800" fill="#c2610c">2.005</text>
    </g>

    <!-- Biểu đồ cột mọc lên -->
    <g transform="translate(20 214)">
      <path d="M0 0H300M0 -30H300M0 -60H300M0 -90H300" stroke="#eceef4"/>
      <g fill="url(#bar)">
        <rect x="14" width="22" rx="3"><animate attributeName="height" values="0;46;46;0" keyTimes="0;.25;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="0;-46;-46;0" keyTimes="0;.25;.85;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="54" width="22" rx="3"><animate attributeName="height" values="0;72;72;0" keyTimes="0;.3;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="0;-72;-72;0" keyTimes="0;.3;.85;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="94" width="22" rx="3"><animate attributeName="height" values="0;38;38;0" keyTimes="0;.35;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="0;-38;-38;0" keyTimes="0;.35;.85;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="134" width="22" rx="3"><animate attributeName="height" values="0;88;88;0" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="0;-88;-88;0" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="174" width="22" rx="3"><animate attributeName="height" values="0;60;60;0" keyTimes="0;.45;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="0;-60;-60;0" keyTimes="0;.45;.85;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="214" width="22" rx="3"><animate attributeName="height" values="0;80;80;0" keyTimes="0;.5;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="0;-80;-80;0" keyTimes="0;.5;.85;1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="254" width="22" rx="3"><animate attributeName="height" values="0;54;54;0" keyTimes="0;.55;.85;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="0;-54;-54;0" keyTimes="0;.55;.85;1" dur="6s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- Vòng tròn tỉ lệ -->
    <g transform="translate(415 170)">
      <circle r="44" fill="none" stroke="#eaf2fd" stroke-width="14"/>
      <circle r="44" fill="none" stroke="#3d73c4" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 277" transform="rotate(-90)"><animate attributeName="stroke-dasharray" values="0 277;208 277;208 277;0 277" keyTimes="0;.4;.85;1" dur="6s" repeatCount="indefinite"/></circle>
      <text y="6" text-anchor="middle" font-size="17" font-weight="800" fill="#172d4b">75%</text>
    </g>

    <!-- Tuyến điều chuyển HN01 → DN01 → HCM01 -->
    <g transform="translate(0 250)">
      <path id="route" d="M60 12H460" stroke="#cfe0f7" stroke-width="3" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1s" repeatCount="indefinite"/></path>
      <use href="#wh" x="60" y="10"/><use href="#wh" x="260" y="10"/><use href="#wh" x="460" y="10"/>
      <g font-size="10" font-weight="700" fill="#254c88" text-anchor="middle"><text x="60" y="34">HN01</text><text x="260" y="34">DN01</text><text x="460" y="34">HCM01</text></g>
      <g>
        <rect x="-9" y="-7" width="18" height="14" rx="3" fill="#f59e0b"/><path d="M-9 -1H9" stroke="#b45309" stroke-width="2"/>
        <animateMotion path="M60 12H460" dur="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.1;.9;1" calcMode="linear"/>
      </g>
    </g>
  </g>
</svg>
